# ══════════════════════════════════════════════════════════════════════════════
#  AI Platform — Docker Compose Staging Overlay
# ══════════════════════════════════════════════════════════════════════════════
#
#  Usage:
#    docker compose --env-file .env.staging \
#      -f docker-compose.unified.yml \
#      -f docker-compose.staging.yml \
#      -p aikompute-staging up -d
#
#  This overlay gives staging its own:
#    ✓ Container names (staging-*)
#    ✓ Host ports (non-conflicting with production)
#    ✓ Docker volumes (isolated data)
#    ✓ Docker network (no crosstalk with production)
#    ✓ Environment overrides (staging URLs, NODE_ENV)
#
#  Port mapping:
#    Production → Staging
#    3000       → 3301   (Customer Portal instance 1)
#    3002       → 3303   (Customer Portal instance 2)
#    20128      → 22028  (OmniRoute-1 Dashboard)
#    20129      → 22029  (OmniRoute-1 API)
#    20130      → 22030  (OmniRoute-2 Dashboard)
#    20131      → 22031  (OmniRoute-2 API)
#    5432       → 55432  (PostgreSQL)
#    6379       → 56379  (Redis)
#    8085       → 8185   (CLIProxyAPI UI)
#
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL — staging gets its own isolated database
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-aiplatform}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiplatform}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - ai-staging-network

  redis:
    image: redis:7-alpine
    container_name: staging-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ai-staging-network

  cliproxyapi:
    container_name: staging-cliproxyapi
    ports: !override
      - "127.0.0.1:8185:8317"
    volumes: !override
      - ./cliproxyapi-config.yaml:/CLIProxyAPI/config.yaml:ro
      - staging_cliproxyapi_data:/root/.cli-proxy-api
    networks: !override
      ai-staging-network: null

  # ─────────────────────────────────────────────────────────────────────────
  # OmniRoute — single instance remapped to staging ports
  # ─────────────────────────────────────────────────────────────────────────
  omniroute:
    container_name: staging-omniroute
    env_file: !override
      - ./OmniRoute/.env.staging
    ports: !override
      - "127.0.0.1:22028:20128"
      - "127.0.0.1:22029:20129"
    volumes: !override
      - staging_omniroute_data:/app/data
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_BASE_URL: ${OMNIROUTE_PUBLIC_URL:-https://admin.aikompute.indevs.in}
      BASE_URL: ${OMNIROUTE_PUBLIC_URL:-https://admin.aikompute.indevs.in}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      NODE_OPTIONS: "--max-old-space-size=1024"
    networks: !override
      ai-staging-network:
        aliases:
          - omniroute

  # ─────────────────────────────────────────────────────────────────────────
  # Customer Portal — single instance remapped to staging ports
  # ─────────────────────────────────────────────────────────────────────────
  customer-portal:
    container_name: staging-customer-portal
    ports: !override
      - "127.0.0.1:3301:3000"
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_APP_URL: ${PUBLIC_URL:-https://aikompute.indevs.in}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-aikompute [STAGING]}
      NEXTAUTH_URL: ${PUBLIC_URL:-https://aikompute.indevs.in}
    networks: !override
      ai-staging-network:
        aliases:
          - customer-portal

  report-deliverer:
    container_name: staging-report-deliverer
    environment:
      PORTAL_INTERNAL_URL: http://customer-portal:3000
      REPORT_DELIVERY_SECRET: ${ADMIN_API_SECRET:-staging-admin}
      NODE_ENV: staging
    networks: !override
      ai-staging-network: null

  # ─────────────────────────────────────────────────────────────────────────
  # Free Models Extractor — isolated staging data volume
  # ─────────────────────────────────────────────────────────────────────────
  free-models-extractor:
    container_name: staging-free-models-extractor
    volumes: !override
      - ./scripts:/app/scripts
      - staging_omniroute_data:/app/data
    networks: !override
      ai-staging-network: null

# ═══════════════════════════════════════════════════════════════════════════════
# Volumes — completely separate from production
# ═══════════════════════════════════════════════════════════════════════════════
volumes:
  staging_postgres_data:
    name: ai-postgres-data-staging
  staging_redis_data:
    name: ai-redis-data-staging
  staging_omniroute_data:
    name: ai-omniroute-data-staging
  staging_cliproxyapi_data:
    name: ai-cliproxyapi-data-staging

# ═══════════════════════════════════════════════════════════════════════════════
# Network — isolated from production
# ═══════════════════════════════════════════════════════════════════════════════
networks:
  ai-staging-network:
    name: ai-staging-network
    driver: bridge
