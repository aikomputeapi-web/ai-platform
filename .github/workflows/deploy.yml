name: Build & Deploy to Production

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by aikomputeapi-web/OmniRoute on pushes to its main branch
  # (.github/workflows/trigger-platform-deploy.yml) so OmniRoute changes
  # rebuild + redeploy without needing a commit here. The build already
  # clones OmniRoute main fresh via scripts/setup-omniroute.sh.
  repository_dispatch:
    types: [omniroute-push]

jobs:
  validate:
    name: Validate Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          cd customer-portal
          npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: |
          cd customer-portal
          npx prisma generate

      - name: Check types
        run: |
          cd customer-portal
          npx tsc --noEmit

      - name: Lint code
        run: |
          cd customer-portal
          npm run lint

  build-and-deploy:
    name: Build & Deploy
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push customer-portal
        uses: docker/build-push-action@v6
        with:
          context: ./customer-portal
          push: true
          tags: |
            ghcr.io/aikomputeapi-web/ai-platform/customer-portal:latest
            ghcr.io/aikomputeapi-web/ai-platform/customer-portal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup OmniRoute source
        run: |
          chmod +x scripts/setup-omniroute.sh
          ./scripts/setup-omniroute.sh

      - name: Build & push omniroute
        uses: docker/build-push-action@v6
        with:
          context: ./OmniRoute
          target: runner-cli
          push: true
          tags: |
            ghcr.io/aikomputeapi-web/ai-platform/omniroute:latest
            ghcr.io/aikomputeapi-web/ai-platform/omniroute:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            echo "══ Authenticating to GHCR ══"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            cd ~/ai-platform

            echo "══ Preserving uncommitted local changes ══"
            # git reset --hard below wipes tracked modifications. Save them
            # first: a patch under ~/ai-platform-predeploy-backups/ plus a
            # git stash entry (recover with `git stash list` / `git stash pop`).
            # Untracked files are unaffected by reset --hard and left alone.
            if ! git diff --quiet HEAD 2>/dev/null; then
              BACKUP_DIR=~/ai-platform-predeploy-backups/$(date +%Y%m%d-%H%M%S)
              mkdir -p "$BACKUP_DIR"
              git status --porcelain > "$BACKUP_DIR/status.txt"
              git diff HEAD > "$BACKUP_DIR/uncommitted.patch"
              git stash push -m "pre-deploy auto-stash $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Saved uncommitted changes to stash and $BACKUP_DIR"
            else
              echo "Working tree clean — nothing to preserve"
            fi

            echo "══ Pulling latest changes ══"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "══ Deploying ══"
            chmod +x deploy.sh manage.sh
            IMAGE_TAG=${{ github.sha }} ./deploy.sh
