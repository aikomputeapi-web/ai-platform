name: Deploy to Staging

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          cd customer-portal
          npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: |
          cd customer-portal
          npx prisma generate

      - name: Check types
        run: |
          cd customer-portal
          npx tsc --noEmit

      - name: Lint code
        run: |
          cd customer-portal
          npm run lint

      - name: Test production build
        run: |
          cd customer-portal
          npm run build

  deploy-staging:
    name: Deploy (Staging)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            cd ~/ai-platform-staging

            echo "══ Preserving uncommitted local changes ══"
            # Same guard as deploy.yml: stash + patch-backup tracked
            # modifications before reset --hard wipes them.
            if ! git diff --quiet HEAD 2>/dev/null; then
              BACKUP_DIR=~/ai-platform-staging-predeploy-backups/$(date +%Y%m%d-%H%M%S)
              mkdir -p "$BACKUP_DIR"
              git status --porcelain > "$BACKUP_DIR/status.txt"
              git diff HEAD > "$BACKUP_DIR/uncommitted.patch"
              git stash push -m "pre-deploy auto-stash $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Saved uncommitted changes to stash and $BACKUP_DIR"
            else
              echo "Working tree clean — nothing to preserve"
            fi

            echo "══ Pulling staging changes ══"
            git fetch origin staging
            git checkout staging
            git reset --hard origin/staging

            echo "══ Deploying to Staging ══"
            chmod +x deploy-staging.sh manage-staging.sh
            ./deploy-staging.sh

