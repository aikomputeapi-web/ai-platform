# ══════════════════════════════════════════════════════════════════════════════
#  AI Platform — Docker Compose (Unified Stack, Blue-Green)
# ══════════════════════════════════════════════════════════════════════════════
#
#  Blue-green single-VPS deployment for near-zero downtime.
#
#  Blue  = active slot (default): `docker compose up -d`
#          → omniroute :20128/:20129, customer-portal :3000, volume ai-omniroute-data
#
#  Green = standby slot (started only during a deploy via the "green" profile):
#          `docker compose --profile green up -d omniroute-green customer-portal-green`
#          → omniroute :20138/:20139, customer-portal :3001, volume ai-omniroute-data-green
#
#  Only ONE slot ever serves traffic (nginx upstream swap) and only ONE slot ever
#  has the OmniRoute SQLite volume mounted. See scripts/blue-green-switch.sh.
#
# ══════════════════════════════════════════════════════════════════════════════

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-omniroute-base: &omniroute-base
  image: ghcr.io/aikomputeapi-web/ai-platform/omniroute:${IMAGE_TAG:-latest}
  restart: unless-stopped
  stop_grace_period: 40s
  logging: *logging
  env_file: ./OmniRoute/.env
  mem_limit: 1536m
  memswap_limit: 1536m
  environment:
    # ── Core ──
    NODE_ENV: production
    DATA_DIR: /app/data
    PORT: 20128
    DASHBOARD_PORT: 20128
    API_PORT: 20129
    API_HOST: 0.0.0.0

    # ── Security ──
    JWT_SECRET: ${OMNIROUTE_JWT_SECRET:?OMNIROUTE_JWT_SECRET is required}
    API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET:?OMNIROUTE_API_KEY_SECRET is required}
    INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:?OMNIROUTE_INITIAL_PASSWORD is required}
    STORAGE_ENCRYPTION_KEY: ${OMNIROUTE_STORAGE_ENCRYPTION_KEY:?OMNIROUTE_STORAGE_ENCRYPTION_KEY is required}

    # ── Redis & Database Integration ──
    REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    PORTAL_DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

    # ── Public URL (for OAuth callbacks) ──
    NEXT_PUBLIC_BASE_URL: https://admin.aikompute.com
    BASE_URL: https://admin.aikompute.com

    # ── Auth settings ──
    REQUIRE_API_KEY: "true"
    AUTH_COOKIE_SECURE: ${SSL_ENABLED:-false}

    # ── Anti-Detection ──
    CLI_COMPAT_ALL: "1"
    ENABLE_TLS_FINGERPRINT: "true"
    ENABLE_SOCKS5_PROXY: "true"

    # ── Performance ──
    OMNIROUTE_MEMORY_MB: 1024
    NODE_OPTIONS: "--max-old-space-size=1024"
    STREAM_IDLE_TIMEOUT_MS: 600000
    FETCH_TIMEOUT_MS: 600000

    # ── Logging ──
    APP_LOG_TO_FILE: "true"
    APP_LOG_LEVEL: info

    # ── Provider Settings ──
    OPENROUTER_FREE_ONLY: "true"
    NVIDIA_FREE_ONLY: "true"
  volumes:
    - omniroute_data:/app/data
    - ./OmniRoute/proxy_scraper_data:/app/proxy_scraper_data:ro
  networks:
    ai-network:
      aliases:
        - omniroute
  healthcheck:
    test: ["CMD", "node", "-e", "const http = require('http'); const req = http.request('http://127.0.0.1:20128', { timeout: 2000 }, (res) => { process.exit(res.statusCode === 200 || res.statusCode === 302 || res.statusCode === 307 || res.statusCode === 404 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 60s

x-portal-base: &portal-base
  image: ghcr.io/aikomputeapi-web/ai-platform/customer-portal:${IMAGE_TAG:-latest}
  restart: unless-stopped
  logging: *logging
  mem_limit: 512m
  memswap_limit: 512m
  depends_on:
    omniroute:
      condition: service_healthy
  environment:
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    JWT_SECRET: ${PORTAL_JWT_SECRET:?PORTAL_JWT_SECRET is required}
    OMNIROUTE_INTERNAL_URL: http://omniroute:20128
    OMNIROUTE_ADMIN_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:?OMNIROUTE_INITIAL_PASSWORD is required}
    NEXT_PUBLIC_APP_URL: ${PUBLIC_URL:-http://localhost:3000}
    NEXT_PUBLIC_APP_NAME: ${APP_NAME:-AI API Platform}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO:-}
    STRIPE_PRICE_ID_MAX_5X: ${STRIPE_PRICE_ID_MAX_5X:-}
    STRIPE_PRICE_ID_MAX_20X: ${STRIPE_PRICE_ID_MAX_20X:-}
    STRIPE_PRICE_ID_PAYG: ${STRIPE_PRICE_ID_PAYG:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
    ADMIN_API_SECRET: ${ADMIN_API_SECRET:?ADMIN_API_SECRET is required}
    AA_API_KEY: ${AA_API_KEY:-}
    NODE_ENV: production
    NEXTAUTH_URL: ${PUBLIC_URL:-http://localhost:3000}
    NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
    APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
  networks:
    ai-network:
      aliases:
        - customer-portal
  healthcheck:
    test: ["CMD", "node", "-e", "const http = require('http'); const req = http.request('http://127.0.0.1:3000/api/health', { timeout: 2000 }, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 15s

services:

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL 15 — Persistent storage for user data & billing
  # ─────────────────────────────────────────────────────────────────────────
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: ai-postgres
  #   restart: unless-stopped
  #   logging: *logging
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-aiplatform}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  #     POSTGRES_DB: ${POSTGRES_DB:-aiplatform}
  #   ports:
  #     - "127.0.0.1:5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiplatform}"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #     start_period: 10s
  #   networks:
  #     - ai-network

  # ─────────────────────────────────────────────────────────────────────────
  # Redis — Externalized to GCP Memorystore
  # ─────────────────────────────────────────────────────────────────────────
  # redis:
  #   image: redis:7-alpine
  #   container_name: ai-redis
  #   restart: unless-stopped
  #   logging: *logging
  #   command: >
  #     redis-server
  #     --maxmemory 256mb
  #     --maxmemory-policy allkeys-lru
  #     --appendonly yes
  #     --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  #   ports:
  #     - "127.0.0.1:6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - ai-network

  # ─────────────────────────────────────────────────────────────────────────
  # OmniRoute — THE dashboard. Single instance.
  # ─────────────────────────────────────────────────────────────────────────
  omniroute:
    <<: *omniroute-base
    container_name: omniroute
    ports:
      - "127.0.0.1:20128:20128"
      - "127.0.0.1:20129:20129"

  # ─────────────────────────────────────────────────────────────────────────
  # OmniRoute GREEN — standby slot. Started only during a blue-green deploy.
  #   • Alternate host ports (20138/20139) so it can run alongside blue briefly
  #   • Separate volume (ai-omniroute-data-green) — a COPY of blue's SQLite data,
  #     never the same volume, so the two slots never open one SQLite file at once
  #   • Shares the "omniroute" network alias so internal service references keep
  #     working after the swap (safe: only one slot serves traffic at a time)
  # ─────────────────────────────────────────────────────────────────────────
  omniroute-green:
    <<: *omniroute-base
    container_name: omniroute-green
    profiles: ["green"]
    ports:
      - "127.0.0.1:20138:20128"
      - "127.0.0.1:20139:20129"
    volumes:
      - omniroute_data_green:/app/data
      - ./OmniRoute/proxy_scraper_data:/app/proxy_scraper_data:ro
    networks:
      ai-network:
        aliases:
          - omniroute
          - omniroute-green

  # ─────────────────────────────────────────────────────────────────────────
  # Customer Portal — Self-service for customers. Single instance.
  # ─────────────────────────────────────────────────────────────────────────
  customer-portal:
    <<: *portal-base
    container_name: customer-portal
    ports:
      - "127.0.0.1:3000:3000"

  # ─────────────────────────────────────────────────────────────────────────
  # Customer Portal GREEN — standby slot. Stateless (Cloud SQL + Redis are
  # external), so no volume handoff needed. Started only during a deploy.
  # ─────────────────────────────────────────────────────────────────────────
  customer-portal-green:
    <<: *portal-base
    container_name: customer-portal-green
    profiles: ["green"]
    depends_on:
      omniroute-green:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      ai-network:
        aliases:
          - customer-portal
          - customer-portal-green

  # ─────────────────────────────────────────────────────────────────────────
  # Scheduled Report Deliverer — polls the portal and sends due reports
  # ─────────────────────────────────────────────────────────────────────────
  report-deliverer:
    image: ghcr.io/aikomputeapi-web/ai-platform/customer-portal:${IMAGE_TAG:-latest}
    container_name: report-deliverer
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      customer-portal:
        condition: service_healthy
    command: ["node", "scripts/deliver-scheduled-reports.mjs"]
    environment:
      PORTAL_INTERNAL_URL: http://customer-portal:3000
      REPORT_DELIVERY_SECRET: ${ADMIN_API_SECRET:?ADMIN_API_SECRET is required}
      REPORT_DELIVERY_LIMIT: 20
      REPORT_DELIVERY_INTERVAL_SECONDS: 300
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://customer-portal:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ai-network

  # ─────────────────────────────────────────────────────────────────────────
  # API Key Reconciler — keeps the Customer Portal (PostgreSQL) and OmniRoute
  # (SQLite) API key stores in sync. OmniRoute is the single source of truth
  # that issues keys; the portal mirrors them. This worker polls the portal's
  # /api/admin/keys/reconcile endpoint every 5 minutes so drift (from blue-green
  # rollbacks, keys made directly in the OmniRoute dashboard, or auto-created
  # CLI/service keys) is corrected automatically — no operator intervention.
  # See docs/API-KEY-SYSTEM-DIAGNOSIS.md §6.
  # ─────────────────────────────────────────────────────────────────────────
  api-key-reconciler:
    image: ghcr.io/aikomputeapi-web/ai-platform/customer-portal:${IMAGE_TAG:-latest}
    container_name: api-key-reconciler
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      customer-portal:
        condition: service_healthy
    command: ["node", "scripts/reconcile-api-keys-worker.mjs"]
    environment:
      PORTAL_INTERNAL_URL: http://customer-portal:3000
      ADMIN_API_SECRET: ${ADMIN_API_SECRET:?ADMIN_API_SECRET is required}
      RECONCILE_INTERVAL_SECONDS: 300
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs'); try{const s=fs.statSync('/tmp/healthy'); process.exit(Date.now()-s.mtimeMs<600000?0:1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ai-network

  # ─────────────────────────────────────────────────────────────────────────
  # Free Models Extractor — pulls free models catalog every 24h
  # ─────────────────────────────────────────────────────────────────────────
  free-models-extractor:
    image: node:24-alpine
    container_name: free-models-extractor
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - ./scripts:/app/scripts
      - omniroute_data:/app/data
    working_dir: /app
    environment:
      OUTPUT_DIR: /app/data
      INTERVAL_SECONDS: 86400
    networks:
      - ai-network
    command: ["node", "scripts/extract-free-models.mjs"]

# ═══════════════════════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════════════════════
volumes:
#  postgres_data:
#    name: ai-postgres-data
#  redis_data:
#    name: ai-redis-data
  omniroute_data:
    name: ai-omniroute-data
  omniroute_data_green:
    name: ai-omniroute-data-green

# ═══════════════════════════════════════════════════════════════════════════════
# Network
# ═══════════════════════════════════════════════════════════════════════════════
networks:
  ai-network:
    name: ai-platform-network
    driver: bridge
