# ══════════════════════════════════════════════════════════════════════════════
#  AI Platform — Nginx Staging Configuration
# ══════════════════════════════════════════════════════════════════════════════

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$upstream_response_time';
    access_log /var/log/nginx/access.log main buffer=16k flush=2m;
    error_log /var/log/nginx/error.log warn;

    # Timeouts (tuned for LLM streaming — responses can take minutes)
    keepalive_timeout 300s;
    client_header_timeout 60s;
    client_body_timeout 300s;
    send_timeout 300s;
    client_max_body_size 50m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=dash_limit:10m rate=10r/s;

    # ══════════════════════════════════════════════════════════════════════════
    # STAGING — Upstreams
    # ══════════════════════════════════════════════════════════════════════════
    upstream staging_dashboard {
        server 127.0.0.1:22028;
        keepalive 16;
    }

    upstream staging_api {
        server 127.0.0.1:22028;
        keepalive 32;
    }

    upstream staging_portal {
        server 127.0.0.1:3301;
        keepalive 8;
    }

    # ── HTTP → HTTPS redirect ──
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # STAGING SERVER — staging.domain.com
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name STG_HOST_PLACEHOLDER;

        ssl_certificate /etc/letsencrypt/live/SSL_CERT_NAME_PLACEHOLDER/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/SSL_CERT_NAME_PLACEHOLDER/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Security headers
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # ── /v1/* — Staging API ──
        location /v1/ {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass http://staging_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Cache-Control no-cache;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
        }

        # ── /health — Health check ──
        location /health {
            access_log off;
            return 200 '{"status":"ok","env":"staging"}';
            add_header Content-Type application/json;
        }

        # ── /* — Staging Customer Portal ──
        location / {
            limit_req zone=dash_limit burst=20 nodelay;

            proxy_pass http://staging_portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # STAGING ADMIN — admin.staging.domain.com
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name admin.STG_HOST_PLACEHOLDER;

        ssl_certificate /etc/letsencrypt/live/SSL_CERT_NAME_PLACEHOLDER/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/SSL_CERT_NAME_PLACEHOLDER/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header X-Robots-Tag "noindex, nofollow" always;

        # ── /* — Staging OmniRoute Dashboard ──
        location / {
            limit_req zone=dash_limit burst=20 nodelay;

            proxy_pass http://staging_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }
    }
}
