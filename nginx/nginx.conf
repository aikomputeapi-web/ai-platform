# ══════════════════════════════════════════════════════════════════════════════
#  AI Platform — Nginx
# ══════════════════════════════════════════════════════════════════════════════
#
#  yourdomain.com/v1/*      → OpenAI Compatible API
#  yourdomain.com/*         → Customer Portal (landing, signup, user dashboard)
#  yourdomain.com/health    → Health check
#  admin.yourdomain.com/*   → OmniRoute Dashboard
#  dashboard.yourdomain.com → Customer Portal Admin (login, admin panel)
#
# ══════════════════════════════════════════════════════════════════════════════

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$upstream_response_time';
    access_log /var/log/nginx/access.log main buffer=16k flush=2m;
    error_log /var/log/nginx/error.log warn;

    # Timeouts (tuned for LLM streaming — responses can take minutes)
    keepalive_timeout 300s;
    client_header_timeout 60s;
    client_body_timeout 300s;
    send_timeout 300s;
    client_max_body_size 50m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=dash_limit:10m rate=10r/s;

    # ──────────────────────────────────────────────────────────────────────
    # Blue-Green upstreams.
    #
    # Exactly one server per upstream is active; the other is marked `down`.
    # scripts/blue-green-switch.sh flips these by toggling the `down` keyword
    # between the BLUE and GREEN lines (identified by the trailing markers),
    # then runs `nginx -t && nginx -s reload`.
    #
    #   BLUE  : omniroute :20128/:20129, portal :3000
    #   GREEN : omniroute :20138/:20139, portal :3001
    # ──────────────────────────────────────────────────────────────────────
    upstream omniroute_dashboard {
        server 127.0.0.1:20128 max_fails=3 fail_timeout=10s;       # BLUE  slot=blue
        server 127.0.0.1:20138 max_fails=3 fail_timeout=10s down;  # GREEN slot=green
        keepalive 32;
    }

    upstream omniroute_api {
        server 127.0.0.1:20129 max_fails=3 fail_timeout=10s;       # BLUE  slot=blue
        server 127.0.0.1:20139 max_fails=3 fail_timeout=10s down;  # GREEN slot=green
        keepalive 100;
    }

    upstream customer_portal {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;        # BLUE  slot=blue
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s down;   # GREEN slot=green
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ──
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # MAIN SERVER — Single domain
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name DOMAIN_PLACEHOLDER;

        # SSL
        ssl_certificate /etc/letsencrypt/live/SSL_CERT_NAME_PLACEHOLDER/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/SSL_CERT_NAME_PLACEHOLDER/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

        # ──────────────────────────────────────────────────────────────────
        # /v1/* — OpenAI-compatible API
        #
        # Your users set:   base_url: https://yourdomain.com/v1
        # ──────────────────────────────────────────────────────────────────
        location /v1/ {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass http://omniroute_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for SSE streaming — do not buffer responses
            proxy_buffering off;
            proxy_cache off;

            # Timeouts for single instance
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;

            # Failover to standby slot if active is down (during blue-green switch)
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        # ──────────────────────────────────────────────────────────────────
        # /health — Quick health check
        # ──────────────────────────────────────────────────────────────────
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # ──────────────────────────────────────────────────────────────────
        # /admin — Redirect to dedicated admin dashboard subdomain
        # ──────────────────────────────────────────────────────────────────
        location /admin {
            return 301 https://dashboard.$host$request_uri;
        }

        # ──────────────────────────────────────────────────────────────────
        # /* — Customer Portal (Landing Page, Login, Dashboard)
        # ──────────────────────────────────────────────────────────────────
        location / {
            limit_req zone=dash_limit burst=20 nodelay;

            proxy_pass http://customer_portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;

            # Timeouts for single instance
            proxy_read_timeout 600s;

            # Failover to standby slot if active is down (during blue-green switch)
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # DASHBOARD SERVER — dashboard.domain.com (Customer Portal Admin)
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name dashboard.DOMAIN_PLACEHOLDER;

        # Reuse the main domain's SSL cert
        ssl_certificate /etc/letsencrypt/live/SSL_CERT_NAME_PLACEHOLDER/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/SSL_CERT_NAME_PLACEHOLDER/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Redirect root to admin dashboard
        location = / {
            return 301 /admin;
        }

        # Proxy everything to customer portal (serves /admin/* and /api/admin/*)
        location / {
            limit_req zone=dash_limit burst=20 nodelay;

            proxy_pass http://customer_portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;

            proxy_read_timeout 600s;

            # Failover to standby slot during blue-green switch
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # ADMIN SERVER — admin.domain.com (OmniRoute Dashboard)
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ~^admin\.;

        # Reuse the main domain's SSL cert
        ssl_certificate /etc/letsencrypt/live/SSL_CERT_NAME_PLACEHOLDER/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/SSL_CERT_NAME_PLACEHOLDER/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ──────────────────────────────────────────────────────────────────
        # /coms-net — coms-net Agent Hub (SSE proxying)
        # ──────────────────────────────────────────────────────────────────
        location = /coms-net {
            return 301 /coms-net/;
        }

        location /coms-net/ {
            proxy_pass http://127.0.0.1:52965/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSE support for coms-net
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # ──────────────────────────────────────────────────────────────────
        # /* — OmniRoute Admin Dashboard
        # ──────────────────────────────────────────────────────────────────
        location / {
            limit_req zone=dash_limit burst=20 nodelay;

            proxy_pass http://omniroute_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support for dashboard live view
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;

            # Failover to standby slot during blue-green switch
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }
}
